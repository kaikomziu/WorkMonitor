<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>記録を見る - WorkMonitor</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<!-- 読み込んでよい場所・通信してよい相手を制限する -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://wbzfrhdhfmqxdjheiutl.supabase.co https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<script src="common.js"></script>
<script src="crypto.js"></script>
<!-- integrity: CDN のファイルが書き換えられていたら読み込まない（SRI） -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"
        integrity="sha256-hZaWX+kY5lZgChtWjToWj1wNPSKmAIhrtvRKZVXbAec=" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"
        integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw=="
        crossorigin="anonymous"></script>
<style>
  .auth { max-width: 420px; margin: 56px auto; }
  .auth h1 { font-size: 22px; margin: 0 0 4px; }
  .tabs { display: flex; gap: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin: 16px 0 4px; }
  .tabs button { flex: 1; font: inherit; border: 0; background: none; color: var(--sub); padding: 7px; border-radius: 7px; cursor: pointer; }
  .tabs button.on { background: var(--accent); color: var(--accent-text); }
  .auth .btn.primary { width: 100%; margin-top: 8px; }
  .auth .alt { margin-top: 14px; font-size: 14px; text-align: center; }
  .hidden { display: none !important; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--sub); margin: 4px 0 8px; }
  .account-box { margin-top: 24px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .account-box > div { flex: 1 1 280px; }
  .btn.danger { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, var(--line)); }
  .btn.danger:hover { background: color-mix(in srgb, var(--down) 10%, var(--card)); }
  .legal-links { margin-top: 14px; font-size: 13px; text-align: center; color: var(--sub); }

  .dash { padding: 24px 0 0; }
  .dash-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .dash-head h1 { font-size: 20px; margin: 0; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .controls select { width: auto; }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { font: inherit; border: 0; background: none; color: var(--sub); padding: 5px 16px; border-radius: 7px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .kpi .label { color: var(--sub); font-size: 13px; }
  .kpi .value { font-size: 26px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kpi .note { color: var(--sub); font-size: 12px; }
  .up { color: var(--up); } .down { color: var(--down); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .chart { position: relative; height: 260px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--sub); font-weight: 500; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { height: 6px; border-radius: 3px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .tag { font-size: 12px; color: var(--sub); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .empty { text-align: center; padding: 48px 16px; }
  .user { color: var(--sub); font-size: 14px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<nav class="nav">
  <div class="wrap">
    <a class="logo" href="./"><img src="icon.png" alt="">WorkMonitor</a>
    <div class="spacer"></div>
    <div class="links">
      <span class="user hidden" id="user-email"></span>
      <button class="icon-btn" data-theme-toggle></button>
      <button class="btn hidden" id="logout">ログアウト</button>
    </div>
  </div>
</nav>

<main class="wrap">
  <!-- ログイン・登録 -->
  <div class="card auth hidden" id="auth">
    <h1 id="auth-title">ログイン</h1>
    <p class="sub small" id="auth-desc">WorkMonitor アプリと同じアカウントでログインすると、同期した記録を見られます。</p>
    <div class="tabs" id="auth-tabs">
      <button data-tab="login" class="on">ログイン</button>
      <button data-tab="signup">新しく登録</button>
    </div>
    <form id="auth-form">
      <label class="field" id="f-email"><span>メールアドレス</span><input type="email" id="email" autocomplete="email" required></label>
      <label class="field" id="f-password"><span>パスワード</span><input type="password" id="password" autocomplete="current-password"></label>
      <label class="check" id="f-remember"><input type="checkbox" id="remember" checked> この端末で暗号鍵を記憶する（共用の PC ではオフに）</label>
      <label class="check" id="f-agree"><input type="checkbox" id="agree"> <span><a href="terms.html" target="_blank" rel="noopener">利用規約</a>と<a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a>に同意する</span></label>
      <button class="btn primary big" type="submit" id="auth-submit">ログイン</button>
    </form>
    <div class="msg" id="auth-msg" role="status"></div>
    <div class="alt" id="auth-alt"><a href="#forgot" id="to-forgot">パスワードを忘れた場合</a></div>
    <div class="legal-links"><a href="terms.html" target="_blank" rel="noopener">利用規約</a> ・ <a href="privacy.html" target="_blank" rel="noopener">プライバシーポリシー</a></div>
  </div>

  <!-- ダッシュボード -->
  <div class="dash hidden" id="dash">
    <div class="dash-head">
      <h1>作業時間</h1>
      <div class="controls">
        <div class="seg" id="group"><button data-group="app" class="on">アプリ別</button><button data-group="cat">カテゴリ別</button></div>
        <div class="seg" id="mode"><button data-mode="day">日</button><button data-mode="week">週</button><button data-mode="month">月</button></div>
        <select id="period" aria-label="期間"></select>
      </div>
    </div>
    <div id="root"><div class="card empty sub">読み込んでいます…</div></div>
    <p class="sub small" id="sync-info" style="margin-top:12px"></p>
    <div class="card account-box">
      <div>
        <b>アカウント</b>
        <div class="sub small">アカウントを削除すると、クラウドの記録・暗号鍵・同意の記録がすべて削除され、元に戻せません（PC の記録は残ります）。</div>
      </div>
      <button class="btn danger" id="delete-account">アカウントを削除</button>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
